<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<title>Twin — Sprachnotizen (lokal)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%239d86ff' stroke-width='6'/%3E%3Cpath d='M50 20 A30 30 0 0 1 50 80 Z' fill='%239d86ff'/%3E%3C/svg%3E" />
<style>
/* ─────────────────────────────────────────────────────────────
   Twin — Sprachnotizen · mobile-first, dark (Single-File)
───────────────────────────────────────────────────────────── */
:root {
  --bg:        #0e1116;
  --bg-2:      #161b22;
  --card:      #1a2029;
  --card-2:    #212a35;
  --border:    #2a3441;
  --text:      #e6edf3;
  --muted:     #8b97a6;
  --accent:    #7c5cff;
  --accent-2:  #9d86ff;
  --accent-soft: rgba(124, 92, 255, .14);
  --rec:       #ff4d5e;
  --rec-soft:  rgba(255, 77, 94, .18);
  --radius:    16px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
body {
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,.10), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom);
}
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: calc(env(safe-area-inset-top) + 14px) 18px 14px;
  background: rgba(14, 17, 22, .82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark { font-size: 26px; color: var(--accent-2); filter: drop-shadow(0 0 10px rgba(124,92,255,.5)); }
.brand-name { font-weight: 700; font-size: 17px; letter-spacing: .2px; }
.brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 19px; cursor: pointer; transition: background .15s;
}
.icon-btn:active { background: var(--card-2); }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 40px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.recorder { box-shadow: 0 8px 30px rgba(0,0,0,.35); }
.rec-row { display: flex; align-items: center; gap: 15px; }
.mic {
  width: 68px; height: 68px; flex-shrink: 0; border-radius: 50%; border: none; cursor: pointer;
  background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: #fff; font-size: 27px;
  display: grid; place-items: center; box-shadow: 0 6px 20px rgba(124,92,255,.4);
  transition: transform .12s, box-shadow .2s, background .2s;
}
.mic:active { transform: scale(.94); }
.mic.recording {
  background: linear-gradient(140deg, var(--rec), #ff7a6b);
  box-shadow: 0 0 0 0 var(--rec-soft); animation: pulse 1.5s ease-out infinite;
}
.mic.recording .mic-glyph::before { content: "■"; }
.mic.recording .mic-glyph { font-size: 22px; }
.mic.recording .mic-glyph > * { display: none; }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 var(--rec-soft); }
  70%  { box-shadow: 0 0 0 18px rgba(255,77,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(255,77,94,0); }
}
.rec-info { flex: 1; min-width: 0; }
.rec-title { font-weight: 600; font-size: 15px; }
.rec-hint { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.rec-timer { font-family: var(--mono); font-size: 19px; color: var(--accent-2); }
.draft {
  width: 100%; margin-top: 15px; padding: 13px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text);
  font-family: var(--font); font-size: 15px; line-height: 1.55; resize: vertical; outline: none;
}
.draft:focus { border-color: var(--accent); }
.draft[readonly] { opacity: .9; }
.interim { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 6px; }
.draft-topics { margin-top: 13px; }
.draft-actions { margin-top: 14px; }
.title-input {
  width: 100%; padding: 11px 13px; margin-bottom: 10px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 11px;
  color: var(--text); font-size: 14px; outline: none; font-family: var(--font);
}
.title-input:focus { border-color: var(--accent); }
.btn-row { display: flex; gap: 9px; flex-wrap: wrap; }
.btn {
  flex: 1; min-width: 130px; padding: 12px 16px; border-radius: 12px; border: none;
  font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: var(--font);
  transition: filter .15s, background .15s;
}
.btn-primary { background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: #fff; }
.btn-primary:active { filter: brightness(.9); }
.btn-ghost { flex: 0 0 auto; min-width: 0; background: var(--card-2); color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:active { background: var(--border); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 13px 10px; text-align: center; }
.stat-val { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--accent-2); }
.stat-lbl { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
.toolbar { margin-bottom: 14px; }
.search {
  width: 100%; padding: 12px 15px; background: var(--card); border: 1px solid var(--border);
  border-radius: 13px; color: var(--text); font-size: 15px; outline: none; font-family: var(--font);
}
.search:focus { border-color: var(--accent); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.filter-chips { margin-top: 11px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 999px;
  font-size: 12.5px; font-weight: 500; cursor: pointer; background: var(--accent-soft);
  color: var(--accent-2); border: 1px solid transparent; user-select: none;
  transition: background .12s, color .12s;
}
.chip.active { background: var(--accent); color: #fff; }
.chip .cnt { opacity: .65; font-size: 11px; }
.chip.static { cursor: default; }
.notes { display: grid; grid-template-columns: 1fr; gap: 13px; }
@media (min-width: 620px) { .notes { grid-template-columns: 1fr 1fr; } }
.note { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.note-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.note-title { font-weight: 600; font-size: 15px; line-height: 1.35; }
.note-actions { display: flex; gap: 2px; flex-shrink: 0; }
.note-actions button { background: none; border: none; cursor: pointer; font-size: 15px; opacity: .45; padding: 3px; transition: opacity .12s; }
.note-actions button:active, .note-actions button.on { opacity: 1; }
.note-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 7px; }
.note-body { font-size: 14px; line-height: 1.6; margin-top: 12px; white-space: pre-wrap; word-break: break-word; }
.note .chips { margin-top: 11px; }
.more-btn { background: none; border: none; color: var(--accent-2); cursor: pointer; font-size: 12.5px; padding: 6px 0 0; }
.empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14.5px; line-height: 1.5; }
.empty-glyph { font-size: 40px; margin-bottom: 14px; opacity: .7; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px);
  transform: translateX(-50%) translateY(20px); background: var(--card-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 18px; font-size: 14px; z-index: 50;
  box-shadow: 0 10px 30px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--rec); }
.toast.ok { border-color: var(--accent); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◐</span>
      <div>
        <div class="brand-name">Twin</div>
        <div class="brand-sub">Dein digitaler Zwilling · lokal</div>
      </div>
    </div>
    <button id="exportBtn" class="icon-btn" title="Daten exportieren" aria-label="Exportieren">⤓</button>
  </header>

  <main class="wrap">
    <section class="recorder card">
      <div class="rec-row">
        <button id="micBtn" class="mic" aria-label="Aufnahme starten/stoppen">
          <span class="mic-glyph">🎙</span>
        </button>
        <div class="rec-info">
          <div id="recTitle" class="rec-title">Neue Sprachnotiz</div>
          <div id="recHint" class="rec-hint">Tippe auf das Mikrofon und sprich los.</div>
        </div>
        <div id="recTimer" class="rec-timer" hidden>0:00</div>
      </div>
      <textarea id="draft" class="draft" rows="4"
        placeholder="Transkript erscheint hier — oder tippe deine Notiz direkt ein…"></textarea>
      <div id="interim" class="interim" hidden></div>
      <div id="draftTopics" class="chips draft-topics" hidden></div>
      <div id="draftActions" class="draft-actions" hidden>
        <input id="draftTitle" class="title-input" type="text"
          placeholder="Titel (optional – wird sonst automatisch abgeleitet)" />
        <div class="btn-row">
          <button id="saveBtn" class="btn btn-primary">Speichern &amp; analysieren</button>
          <button id="discardBtn" class="btn btn-ghost">Verwerfen</button>
        </div>
      </div>
    </section>

    <section id="stats" class="stats" hidden>
      <div class="stat"><div class="stat-val" id="stNotes">0</div><div class="stat-lbl">Notizen</div></div>
      <div class="stat"><div class="stat-val" id="stTopics">0</div><div class="stat-lbl">Themen</div></div>
      <div class="stat"><div class="stat-val" id="stMin">0</div><div class="stat-lbl">Minuten</div></div>
    </section>

    <section id="toolbar" class="toolbar" hidden>
      <input id="search" class="search" type="search" placeholder="In allen Notizen suchen…" />
      <div id="topicFilter" class="chips filter-chips"></div>
    </section>

    <section id="notes" class="notes"></section>
    <div id="empty" class="empty">
      <div class="empty-glyph">🎙</div>
      <div>Noch keine Notizen.<br />Nimm deine erste Sprachnotiz auf.</div>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

<script>
/* ─────────────────────────────────────────────────────────────
   Twin — Sprachnotizen (Single-File, kein Backend)
   Aufnahme → Live-Transkription → Analyse → Speicher → Suche
   Alles bleibt lokal (localStorage) auf dem Gerät.
───────────────────────────────────────────────────────────── */
'use strict';

// ── 1. Text-Analyse ───────────────────────────────────────────
const STOPWORDS = new Set(('aber alle allem allen aller alles also auch auf aus bei beim bin bis ' +
  'bist dann dass dein dem den der des dessen die dies diese diesem diesen dieser dieses doch dort ' +
  'durch ein eine einem einen einer eines etwas euer eure für gegen gewesen hab habe haben hat hatte ' +
  'hatten hier hin hinter ich ihr ihre ihrem ihren ihrer ihres ins ist jede jedem jeden jeder jedes ' +
  'jener jetzt kann kein keine keinem keinen keiner können machen man mehr mein meine mit muss musste ' +
  'nach nicht nichts noch nun nur oben oder schon sehr sein seine seinem seinen seiner seines selbst ' +
  'sich sie sind soll sollte sondern sonst über und uns unser unter viel vom von vor wann war waren ' +
  'warum was weg weil weiter welche welchem welchen welcher welches wenn werde werden wie wieder will ' +
  'wir wird wirst wo wollen wollte würde zum zur zwar zwischen ja nein quasi halt eben einfach ' +
  'irgendwie sozusagen wirklich eigentlich total immer gerade gleich mal ganz denn damit dazu daran ' +
  'darauf davon dadurch dabei the and for that this with you are was have has not but they from what ' +
  'when your our can will would should about there their been were').split(' '));

function normToken(raw) {
  return raw.toLowerCase().replace(/[^a-zäöüß0-9-]/g, '').replace(/^-+|-+$/g, '');
}
function extractTopics(text, max = 6) {
  if (!text.trim()) return [];
  const score = new Map(), display = new Map();
  for (const w of text.split(/\s+/)) {
    const tok = normToken(w);
    if (tok.length < 4 || STOPWORDS.has(tok) || /^\d+$/.test(tok)) continue;
    const letters = w.replace(/[^A-Za-zÄÖÜäöüß]/g, '');
    const isCap = /^[A-ZÄÖÜ]/.test(letters);
    score.set(tok, (score.get(tok) || 0) + (isCap ? 1.6 : 1));
    if (!display.has(tok) || isCap) {
      const clean = w.replace(/[^A-Za-zÄÖÜäöüß0-9-]/g, '');
      display.set(tok, isCap ? clean : clean.charAt(0).toUpperCase() + clean.slice(1));
    }
  }
  return [...score.entries()].sort((a, b) => b[1] - a[1]).slice(0, max).map(([t]) => display.get(t));
}
function deriveTitle(text, maxLen = 60) {
  const trimmed = text.trim();
  if (!trimmed) return '';
  const first = trimmed.split(/[.!?\n]/)[0].trim();
  const base = first.length >= 8 ? first : trimmed;
  return base.length <= maxLen ? base : base.slice(0, maxLen).replace(/\s+\S*$/, '') + '…';
}
const countWords = (t) => (t.trim() ? t.trim().split(/\s+/).length : 0);

// ── 2. Speicher ───────────────────────────────────────────────
const STORE_KEY = 'twin_notes_v1';
let notes = [];
try { notes = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { notes = []; }
if (!Array.isArray(notes)) notes = [];
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(notes)); } catch {} }

// ── 3. Helpers ────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function fmtDur(sec) {
  if (!sec) return '';
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function fmtDate(iso) {
  try {
    return new Date(iso).toLocaleDateString('de-DE',
      { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return iso; }
}
let toastTimer = null;
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; setTimeout(() => (el.hidden = true), 250); }, 2600);
}

// ── 4. Aufnahme (Web Speech API) ──────────────────────────────
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let rec = null, recording = false, seconds = 0, timer = null, finalText = '';

function updateDraftUI() {
  const has = finalText.trim().length > 0;
  $('draftActions').hidden = recording || !has;
  const tp = has ? extractTopics(finalText, 5) : [];
  const box = $('draftTopics');
  if (tp.length) {
    box.hidden = false;
    box.innerHTML = '<span class="chip static" style="background:none;border:none;color:var(--muted);padding-left:0">Erkannte Themen:</span>'
      + tp.map((t) => `<span class="chip static">#${esc(t)}</span>`).join('');
  } else box.hidden = true;
}
function startRec() {
  if (!SR) { toast('Spracherkennung wird von diesem Browser nicht unterstützt — bitte Text tippen.', 'err'); return; }
  rec = new SR();
  rec.lang = 'de-DE';
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText = (finalText + ' ' + r[0].transcript).replace(/\s+/g, ' ').trim();
      else interim += r[0].transcript;
    }
    $('draft').value = (finalText + ' ' + interim).trim();
    const im = $('interim');
    im.hidden = !interim; im.textContent = interim ? '… ' + interim : '';
    updateDraftUI();
  };
  rec.onerror = (ev) => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
      toast('Mikrofon-Zugriff verweigert. Bitte in den Einstellungen erlauben.', 'err');
      stopRec();
    }
  };
  rec.onend = () => { if (recording) { try { rec.start(); } catch {} } };
  try {
    rec.start();
    recording = true; seconds = 0;
    $('micBtn').classList.add('recording');
    $('recTitle').textContent = 'Aufnahme läuft…';
    $('recHint').textContent = 'Sprich einfach — der Text erscheint live.';
    $('recTimer').hidden = false; $('recTimer').textContent = '0:00';
    $('draft').setAttribute('readonly', '');
    timer = setInterval(() => { seconds++; $('recTimer').textContent = fmtDur(seconds) || '0:00'; }, 1000);
  } catch { toast('Aufnahme konnte nicht gestartet werden.', 'err'); }
}
function stopRec() {
  recording = false;
  clearInterval(timer); timer = null;
  if (rec) { const r = rec; rec = null; try { r.stop(); } catch {} }
  $('micBtn').classList.remove('recording');
  $('recTitle').textContent = 'Neue Sprachnotiz';
  $('recHint').textContent = SR ? 'Tippe auf das Mikrofon und sprich los.' : 'Tippe deine Notiz unten ein.';
  $('recTimer').hidden = true;
  $('interim').hidden = true;
  $('draft').removeAttribute('readonly');
  updateDraftUI();
}
function resetDraft() {
  stopRec();
  finalText = ''; seconds = 0;
  $('draft').value = ''; $('draftTitle').value = '';
  updateDraftUI();
}
function saveDraft() {
  const text = $('draft').value.trim();
  if (!text) { toast('Noch kein Text erfasst.', 'err'); return; }
  const note = {
    id: 'vn-' + Date.now(),
    title: ($('draftTitle').value.trim() || deriveTitle(text)) || 'Ohne Titel',
    transcript: text,
    topics: extractTopics(text),
    durationSec: seconds,
    wordCount: countWords(text),
    createdAt: new Date().toISOString(),
    pinned: false,
  };
  notes.unshift(note);
  persist(); resetDraft(); render();
  toast('Gespeichert & analysiert.', 'ok');
}

// ── 5. Rendering ──────────────────────────────────────────────
let query = '', activeTopic = null;
function topicCounts() {
  const m = new Map();
  for (const n of notes) for (const t of n.topics) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
}
function filtered() {
  const q = query.trim().toLowerCase();
  return notes
    .filter((n) => !activeTopic || n.topics.includes(activeTopic))
    .filter((n) => !q || n.title.toLowerCase().includes(q) ||
      n.transcript.toLowerCase().includes(q) || n.topics.some((t) => t.toLowerCase().includes(q)))
    .sort((a, b) => (!!a.pinned !== !!b.pinned ? (a.pinned ? -1 : 1) : b.createdAt.localeCompare(a.createdAt)));
}
function noteHTML(n) {
  const long = n.transcript.length > 220;
  const meta = ['🕑 ' + fmtDate(n.createdAt)];
  if (n.durationSec > 0) meta.push('⏱ ' + fmtDur(n.durationSec) + ' min');
  meta.push('📝 ' + n.wordCount + ' Wörter');
  return `<article class="note" data-id="${n.id}">
    <div class="note-head">
      <div class="note-title">${n.pinned ? '📌 ' : ''}${esc(n.title)}</div>
      <div class="note-actions">
        <button data-act="pin" class="${n.pinned ? 'on' : ''}" title="Anpinnen">📌</button>
        <button data-act="del" title="Löschen">🗑</button>
      </div>
    </div>
    <div class="note-meta">${meta.map((m) => `<span>${m}</span>`).join('')}</div>
    ${n.topics.length ? `<div class="chips">${n.topics.map((t) => `<span class="chip static">#${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="note-body" data-full="${esc(n.transcript)}">${esc(long ? n.transcript.slice(0, 220).replace(/\s+\S*$/, '') + '…' : n.transcript)}</div>
    ${long ? '<button class="more-btn" data-act="more">mehr anzeigen</button>' : ''}
  </article>`;
}
function render() {
  const has = notes.length > 0;
  $('stats').hidden = !has;
  $('toolbar').hidden = !has;
  $('empty').hidden = has;
  if (has) {
    $('stNotes').textContent = notes.length;
    const tc = topicCounts();
    $('stTopics').textContent = tc.length;
    $('stMin').textContent = Math.round(notes.reduce((s, n) => s + n.durationSec, 0) / 60);
    $('topicFilter').innerHTML =
      `<span class="chip ${activeTopic === null ? 'active' : ''}" data-topic="">Alle</span>` +
      tc.map(([t, c]) => `<span class="chip ${activeTopic === t ? 'active' : ''}" data-topic="${esc(t)}">#${esc(t)} <span class="cnt">${c}</span></span>`).join('');
  }
  const list = filtered();
  const wrap = $('notes');
  if (has && list.length === 0) {
    wrap.innerHTML = `<div class="empty" style="grid-column:1/-1;padding:40px 20px">Keine Treffer.</div>`;
  } else {
    wrap.innerHTML = list.map(noteHTML).join('');
  }
}

// ── 6. Events ─────────────────────────────────────────────────
$('micBtn').addEventListener('click', () => (recording ? stopRec() : startRec()));
$('saveBtn').addEventListener('click', saveDraft);
$('discardBtn').addEventListener('click', resetDraft);
$('draft').addEventListener('input', (e) => { if (!recording) { finalText = e.target.value; updateDraftUI(); } });
$('search').addEventListener('input', (e) => { query = e.target.value; render(); });
$('topicFilter').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-topic]');
  if (!chip) return;
  const t = chip.getAttribute('data-topic');
  activeTopic = t === '' ? null : (activeTopic === t ? null : t);
  render();
});
$('notes').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const art = e.target.closest('.note');
  const id = art && art.getAttribute('data-id');
  const act = btn.getAttribute('data-act');
  if (act === 'more') {
    const body = art.querySelector('.note-body');
    const full = body.getAttribute('data-full');
    const expanded = btn.textContent === 'weniger anzeigen';
    body.textContent = expanded ? full.slice(0, 220).replace(/\s+\S*$/, '') + '…' : full;
    btn.textContent = expanded ? 'mehr anzeigen' : 'weniger anzeigen';
    return;
  }
  const idx = notes.findIndex((n) => n.id === id);
  if (idx < 0) return;
  if (act === 'pin') { notes[idx].pinned = !notes[idx].pinned; }
  if (act === 'del') { if (!confirm('Diese Notiz löschen?')) return; notes.splice(idx, 1); }
  persist(); render();
});
$('exportBtn').addEventListener('click', () => {
  if (!notes.length) { toast('Noch nichts zu exportieren.', 'err'); return; }
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'twin-notizen-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Export gestartet.', 'ok');
});
if (!SR) $('recHint').textContent = 'Live-Spracherkennung hier nicht verfügbar — tippe deine Notiz unten ein.';

// ── 7. Start ──────────────────────────────────────────────────
render();
</script>
</body>
</html>
